local_backend: true

backend:
  name: github
  repo: dagidack/cosmetology
  branch: main
  auth_endpoint: api/auth
  app_id: Iv23IizDDKTWoLVyfYw2

media_folder: images
public_folder: /images

collections:
  - name: site
    label: Site content
    files:
      - label: Photos, services and gallery
        name: content
        file: content/site.json
        fields:
          - { label: Hero photo, name: heroImage, widget: image }
          - { label: About photo, name: aboutImage, widget: image }
          - label: Services (price list)
            name: services
            widget: list
            summary: "{{titleFi}} — {{price}} €"
            fields:
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Facials, value: facials }
                  - { label: Nails, value: nails }
                  - { label: Lashes & brows, value: brows }
                  - { label: Extra services, value: extras }
              - { label: Title (FI), name: titleFi, widget: string }
              - { label: Title (SV), name: titleSv, widget: string, required: false }
              - { label: Title (EN), name: titleEn, widget: string, required: false }
              - { label: Title (UK), name: titleUk, widget: string, required: false }
              - { label: Title (RU), name: titleRu, widget: string, required: false }
              - { label: Description (FI), name: descriptionFi, widget: text, required: false }
              - { label: Description (SV), name: descriptionSv, widget: text, required: false }
              - { label: Description (EN), name: descriptionEn, widget: text, required: false }
              - { label: Description (UK), name: descriptionUk, widget: text, required: false }
              - { label: Description (RU), name: descriptionRu, widget: text, required: false }
              - { label: Price (€), name: price, widget: number, value_type: int, min: 0 }
              - { label: Photo, name: image, widget: image }
              - { label: Show on home, name: featured, widget: boolean, default: false }
          - label: Gallery
            name: gallery
            widget: list
            summary: "{{altFi}}"
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Alt text (FI), name: altFi, widget: string, required: false }
              - { label: Alt text (SV), name: altSv, widget: string, required: false }
              - { label: Alt text (EN), name: altEn, widget: string, required: false }
              - { label: Alt text (UK), name: altUk, widget: string, required: false }
              - { label: Alt text (RU), name: altRu, widget: string, required: false }
